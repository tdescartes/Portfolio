<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="roomGlow" cx="50%" cy="50%" r="85%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <radialGradient id="screenGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#28e98c" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="screenGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="screenGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="rgbStrip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#28e98c" />
      <stop offset="33%" stop-color="#38bdf8" />
      <stop offset="66%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="photoFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="1"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.8"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip Path for Perfect Symmetrical Portrait Frame -->
    <clipPath id="portraitClip">
      <!-- Perfectly Symmetrical Elongated Hexagonal / Curved Tech Card Frame -->
      <path d="M 230,220 
               C 230,170 300,140 400,140 
               C 500,140 570,170 570,220 
               L 570,680 
               C 570,720 500,740 400,740 
               C 300,740 230,720 230,680 Z"/>
    </clipPath>

    <!-- Code Line Pattern -->
    <pattern id="codePattern" width="200" height="120" patternUnits="userSpaceOnUse">
      <rect width="200" height="120" fill="none"/>
      <text x="10" y="20" fill="#28e98c" font-family="monospace" font-size="11" opacity="0.9">const dev = new Engineer();</text>
      <text x="25" y="40" fill="#38bdf8" font-family="monospace" font-size="11" opacity="0.8">await dev.buildAI();</text>
      <text x="25" y="60" fill="#c084fc" font-family="monospace" font-size="11" opacity="0.85">return &lt;Future /&gt;;</text>
      <text x="10" y="80" fill="#f43f5e" font-family="monospace" font-size="11" opacity="0.7">process.env.STATUS = "HIRED";</text>
      <text x="10" y="100" fill="#28e98c" font-family="monospace" font-size="11" opacity="0.95">// Ex-MSFT &amp; Google Intern</text>
    </pattern>
  </defs>

  <!-- 1. Dark Room Background -->
  <rect width="800" height="800" fill="url(#roomGlow)" />
  
  <!-- Subtle Grid Grid Lines -->
  <path d="M 0,100 L 800,100 M 0,200 L 800,200 M 0,300 L 800,300 M 0,400 L 800,400 M 0,500 L 800,500 M 0,600 L 800,600 M 0,700 L 800,700" stroke="#1e293b" stroke-width="1" opacity="0.25"/>
  <path d="M 100,0 L 100,800 M 200,0 L 200,800 M 300,0 L 300,800 M 400,0 L 400,800 M 500,0 L 500,800 M 600,0 L 600,800 M 700,0 L 700,800" stroke="#1e293b" stroke-width="1" opacity="0.25"/>

  <!-- Screen Backlight Glow -->
  <circle cx="400" cy="340" r="320" fill="url(#screenGlow)" />

  <!-- 2. Computer Setup / Battlestation Background -->
  
  <!-- Left Curved Monitor -->
  <g transform="rotate(7 160 300)">
    <rect x="20" y="140" width="250" height="340" rx="12" fill="url(#screenGradLeft)" stroke="#334155" stroke-width="6"/>
    <rect x="28" y="148" width="234" height="324" rx="8" fill="#090d16"/>
    <rect x="32" y="152" width="226" height="316" fill="url(#codePattern)" opacity="0.9"/>
    <rect x="28" y="148" width="234" height="24" fill="#1e293b"/>
    <circle cx="42" cy="160" r="4" fill="#ef4444"/>
    <circle cx="54" cy="160" r="4" fill="#eab308"/>
    <circle cx="66" cy="160" r="4" fill="#22c55e"/>
    <text x="80" y="164" fill="#94a3b8" font-family="sans-serif" font-size="10">App.tsx - VS Code</text>
  </g>

  <!-- Right Curved Monitor -->
  <g transform="rotate(-7 640 300)">
    <rect x="530" y="140" width="250" height="340" rx="12" fill="url(#screenGradRight)" stroke="#334155" stroke-width="6"/>
    <rect x="538" y="148" width="234" height="324" rx="8" fill="#0b0f19"/>
    <rect x="538" y="148" width="234" height="24" fill="#1e293b"/>
    <circle cx="552" cy="160" r="4" fill="#ef4444"/>
    <circle cx="564" cy="160" r="4" fill="#eab308"/>
    <circle cx="576" cy="160" r="4" fill="#22c55e"/>
    <text x="590" y="164" fill="#94a3b8" font-family="sans-serif" font-size="10">Terminal &amp; AI Stack</text>

    <!-- Simulated Terminal lines -->
    <text x="548" y="190" fill="#38bdf8" font-family="monospace" font-size="11">$ npm run dev</text>
    <text x="548" y="210" fill="#28e98c" font-family="monospace" font-size="11">✓ Vite v6.4 Ready</text>
    <text x="548" y="230" fill="#e2e8f0" font-family="monospace" font-size="10">&gt; Local: http://localhost:5173/</text>
    <text x="548" y="250" fill="#c084fc" font-family="monospace" font-size="10">&gt; Status: 200 OK</text>

    <!-- Graph Wave -->
    <path d="M 548,360 Q 580,300 610,340 T 670,280 T 750,320" fill="none" stroke="#28e98c" stroke-width="3" filter="url(#cyanGlow)"/>
    <path d="M 548,380 Q 580,340 610,370 T 670,320 T 750,350" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- Center Main Ultra-Wide Monitor Outline Behind Frame -->
  <rect x="180" y="120" width="440" height="370" rx="16" fill="#090d16" stroke="#475569" stroke-width="6"/>
  <rect x="190" y="130" width="420" height="350" rx="10" fill="#040711"/>
  <!-- Holographic Matrix Nodes -->
  <g opacity="0.75">
    <circle cx="260" cy="200" r="6" fill="#28e98c" filter="url(#cyanGlow)"/>
    <circle cx="340" cy="170" r="5" fill="#38bdf8"/>
    <circle cx="460" cy="170" r="5" fill="#c084fc"/>
    <circle cx="540" cy="200" r="6" fill="#28e98c" filter="url(#cyanGlow)"/>
    <line x1="260" y1="200" x2="340" y2="170" stroke="#28e98c" stroke-width="1.5" opacity="0.6"/>
    <line x1="340" y1="170" x2="460" y2="170" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
    <line x1="460" y1="170" x2="540" y2="200" stroke="#c084fc" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Desk Surface & RGB Strip -->
  <rect x="0" y="660" width="800" height="140" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <rect x="0" y="656" width="800" height="6" fill="url(#rgbStrip)" filter="url(#neonGlow)"/>

  <!-- Backlit Mechanical Keyboard -->
  <g transform="translate(240, 680)">
    <rect x="0" y="0" width="320" height="85" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="10" y="10" width="300" height="65" rx="4" fill="#0f172a"/>
    <path d="M 20,25 H 300 M 20,40 H 300 M 20,55 H 300" stroke="#28e98c" stroke-width="2" stroke-dasharray="8 4" opacity="0.7" filter="url(#cyanGlow)"/>
  </g>

  <!-- 3. Symmetrical Real-Photo Integrated Anime Tech Card -->
  <g id="portraitGroup">
    <!-- Outer Neon Card Border -->
    <path d="M 224,214 
             C 224,164 296,134 400,134 
             C 504,134 576,164 576,214 
             L 576,686 
             C 576,726 504,746 400,746 
             C 296,746 224,726 224,686 Z"
          fill="none" stroke="#28e98c" stroke-width="4" filter="url(#cyanGlow)"/>

    <!-- Embedded Real Photo (Guaranteeing 100% Exact Facial Likeness & Perfect Symmetry) -->
    <g clip-path="url(#portraitClip)">
      <image href="/portrait_dark_studio.png" x="180" y="130" width="440" height="620" preserveAspectRatio="xMidYMin slice" />
      <!-- Subtle Bottom Fade Overlay for Smooth Desk Integration -->
      <rect x="220" y="550" width="360" height="200" fill="url(#photoFade)"/>
    </g>

    <!-- 4. Symmetrical Anime Tech Overlays -->
    <!-- Nerdy Rectangular Tech Glasses Overlay -->
    <g id="animeGlasses" transform="translate(0, -12)">
      <!-- Left Lens Frame -->
      <rect x="332" y="342" width="60" height="38" rx="6" fill="none" stroke="#28e98c" stroke-width="3" filter="url(#cyanGlow)"/>
      <rect x="334" y="344" width="56" height="34" rx="4" fill="#38bdf8" opacity="0.12"/>
      <path d="M 338,346 L 368,346 L 350,376 Z" fill="#ffffff" opacity="0.25"/>

      <!-- Right Lens Frame -->
      <rect x="408" y="342" width="60" height="38" rx="6" fill="none" stroke="#28e98c" stroke-width="3" filter="url(#cyanGlow)"/>
      <rect x="410" y="344" width="56" height="34" rx="4" fill="#38bdf8" opacity="0.12"/>
      <path d="M 414,346 L 444,346 L 426,376 Z" fill="#ffffff" opacity="0.25"/>

      <!-- Bridge & Temples -->
      <line x1="392" y1="356" x2="408" y2="356" stroke="#28e98c" stroke-width="3" filter="url(#cyanGlow)"/>
    </g>

    <!-- Developer Headphones Around Neck -->
    <g id="headphones">
      <path d="M 295,490 C 295,570 505,570 505,490" stroke="#020617" stroke-width="22" fill="none" stroke-linecap="round"/>
      <path d="M 295,490 C 295,570 505,570 505,490" stroke="#28e98c" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#cyanGlow)"/>
      <rect x="280" y="470" width="30" height="46" rx="10" fill="#1e293b" stroke="#28e98c" stroke-width="2"/>
      <rect x="490" y="470" width="30" height="46" rx="10" fill="#1e293b" stroke="#28e98c" stroke-width="2"/>
    </g>
  </g>

  <!-- 5. Floating Code & Anime Tech HUD Particles -->
  <g id="particles" opacity="0.9">
    <text x="100" y="590" fill="#28e98c" font-family="monospace" font-size="14" font-weight="bold" filter="url(#cyanGlow)">&lt;code/&gt;</text>
    <text x="640" y="570" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold" filter="url(#cyanGlow)">{ AI: true }</text>
    <circle cx="130" cy="490" r="3.5" fill="#28e98c" filter="url(#neonGlow)"/>
    <circle cx="670" cy="470" r="4" fill="#c084fc" filter="url(#neonGlow)"/>
    
    <!-- Symmetrical Corner Tech Crosshairs -->
    <path d="M 210,180 L 230,180 M 210,180 L 210,200" stroke="#28e98c" stroke-width="2" filter="url(#cyanGlow)"/>
    <path d="M 590,180 L 570,180 M 590,180 L 590,200" stroke="#28e98c" stroke-width="2" filter="url(#cyanGlow)"/>
  </g>
</svg>
